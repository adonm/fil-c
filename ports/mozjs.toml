# Port: SpiderMonkey / MozJS
# Mozilla's JavaScript engine (C++)
#
# This is SpiderMonkey built as a standalone library (libmozjs).
# It provides the JS engine used by Firefox and embeddable in C/C++/Rust apps.
#
# To add SpiderMonkey source:
#   1. Clone mozilla-unified:  git clone https://github.com/mozilla/gecko-dev projects/mozilla
#      (use --depth 1 and --filter=tree:0 for a shallow clone of just js/)
#   2. Check out a release tag: cd projects/mozilla && git checkout FIREFOX_RELEASE_140_BASE
#   3. Commit to this repo
#
# Or use:  filc port fetch mozjs
#
# NOTE: SpiderMonkey is a complex port. The build system (mach/mozbuild)
# may need patches. First attempt: use the standalone js/src build.

[port]
name = "mozjs"
version = "140.0"
description = "Mozilla SpiderMonkey JavaScript engine (libmozjs)"
homepage = "https://spidermonkey.dev"

[source]
dir = "projects/mozilla"
fetch = { type = "git", url = "https://github.com/mozilla/gecko-dev", tag = "FIREFOX_RELEASE_140_BASE" }
# For faster clone of just the js engine:
# fetch = { type = "git", url = "https://github.com/mozilla/gecko-dev", tag = "FIREFOX_RELEASE_140_BASE",
#           sparse = "js/src" }

[dependencies]
deps = ["zlib", "icu"]

[build]
script = """
. libpas/common.sh
set -e

# SpiderMonkey standalone build
# See: https://firefox-source-docs.mozilla.org/js/build.html
cd js/src

# Create build directory
mkdir -p build_OPT.OBJ && cd build_OPT.OBJ

# Configure with system ICU and zlib, no jemalloc
CC="../../../../build/bin/clang" \
CXX="../../../../build/bin/clang++" \
AR="../../../../build/bin/llvm-ar" \
CFLAGS="-g -O2" \
CXXFLAGS="-g -O2 -std=c++17" \
../configure \
  --prefix="$PREFIX" \
  --target=x86_64-pc-linux \
  --disable-jemalloc \
  --with-system-zlib \
  --with-system-icu \
  --with-intl-api \
  --enable-optimize \
  --disable-debug \
  --without-x

make -j $NCPU
make install
"""

[pkgconfig]
cflags = "-I${includedir}/mozjs-140"
libs = "-L${libdir} -lmozjs-140"
