# Port: OpenSSL
# TLS/SSL library needed by curl, duckdb (HTTPFS), and many others

[port]
name = "openssl"
version = "3.5.7"
description = "TLS/SSL and crypto library"
homepage = "https://openssl.org"

[source]
dir = "projects/openssl-3.5.7"

[dependencies]
deps = ["zlib"]

[build]
script = """
. ../../libpas/common.sh
set -e

# Perl FindBin module may not be in default @INC
export PERL5LIB="/home/linuxbrew/.linuxbrew/lib/perl5/5.42:$PERL5LIB"

extract_source
./Configure \
    zlib \
    --prefix="$PREFIX" \
    --libdir=lib \
    -I"$PREFIX/../zlib/include" \
    -L"$PREFIX/../zlib/lib" \
    CC="$CC" \
    CXX="$CXX"
make -j $NCPU
make -j $NCPU install_sw
make -j $NCPU install_ssldirs
"""

[pkgconfig]
cflags = "-I${includedir}"
libs = "-L${libdir} -lssl -lcrypto"
