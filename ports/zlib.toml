# Port: zlib
# Compression library needed by many packages (openssl, curl, duckdb, mozjs)

[port]
name = "zlib"
version = "1.3"
description = "Compression library"
homepage = "https://zlib.net"

[source]
dir = "projects/zlib-1.3"

[dependencies]
# zlib has no dependencies

[build]
script = """
. libpas/common.sh
set -e
CC="$CCPREFIX$PWD/../../../build/bin/clang" CFLAGS="-O3 -g" ./configure \
    --prefix="$PREFIX"
$MAKE -j $NCPU
$MAKE install
"""

[pkgconfig]
cflags = "-I${includedir}"
libs = "-L${libdir} -lz"
